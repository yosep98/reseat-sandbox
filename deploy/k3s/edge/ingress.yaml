# HTTPS 리다이렉트를 Traefik 엔트리포인트 레벨(전역)로 걸면 cert-manager의 ACME HTTP-01 챌린지
# (/.well-known/acme-challenge/*)까지 https로 튕겨서 인증서 발급 자체가 막힘 — 실제로 겪은 문제.
# 그래서 리다이렉트도 라우팅 우선순위(경로 구체성)에 맡기는 Ingress 단위 미들웨어로 처리.
# cert-manager가 만드는 임시 solver Ingress(정확 경로 매치)가 우리 "/" prefix보다 항상 우선하므로
# 챌린지 요청은 리다이렉트를 안 타고 그대로 통과함.

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: reseat
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# 1차 rate limit (IP 단위) — K3s-도입-아키텍처.md §2 참고. 2차(유저 단위, Redis)는 Step 6에서 gateway-service에 추가 예정.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-mw
  namespace: reseat
spec:
  rateLimit:
    average: 20
    burst: 40
---
# 80번 포트(web 엔트리포인트) 전용 — HTTPS로 리다이렉트만 함
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reseat-http-redirect
  namespace: reseat
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: reseat-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: reseat.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
# 443번 포트(websecure 엔트리포인트) 전용 — 실제 서비스 라우팅
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reseat-ingress
  namespace: reseat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: reseat-ratelimit-mw@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - reseat.duckdns.org
      secretName: reseat-tls
  rules:
    - host: reseat.duckdns.org
      http:
        paths:
          # /api/*는 게이트웨이로 - 세부 서비스 라우팅은 gateway-service의 GatewayRouteConfig가 담당
          # (기존 deploy/nginx/conf.d/default.conf 규칙 그대로 이식)
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          # 2026-09-08: 모니터링 대시보드 - Grafana 자체 로그인(admin/grafana-secret)으로만 보호됨,
          # IP 제한 없이 전체 공개(사용자 결정). duckdns라 서브도메인 대신 경로로 노출.
          - path: /grafana/
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          # 그 외 전부 프론트(Next.js SSR)로 - /api/*, /grafana/* prefix가 더 구체적이라 순서 무관
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
