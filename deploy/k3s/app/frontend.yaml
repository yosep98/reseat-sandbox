apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reseat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_fe/frontend:k3s-rag-ui
          ports:
            - containerPort: 3000
          resources:
            # CPU request는 실사용량(top pods 기준 ~1m) 대비 요청값이 200배 컸음 - 실사용량 대비
            # 여유를 넉넉히 둔 100m으로 재조정(2026-09-08). limit은 순간 버스트 대비 그대로 유지.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reseat
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
