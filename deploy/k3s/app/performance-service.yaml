
apiVersion: v1
kind: ConfigMap
metadata:
  name: performance-config
  namespace: reseat
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/reseat?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul"
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
  ORDER_SERVICE_URL: http://order-service:8082
  USER_SERVICE_URL: http://user-service:8081
  SPRING_JPA_SHOW_SQL: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-service
  namespace: reseat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: performance-service
  template:
    metadata:
      labels:
        app: performance-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: performance-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_be/performance-service:k3s-rag-recommendation
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: performance-config
          env:
            - name: TZ
              value: Asia/Seoul
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1152Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 35
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: performance-service
  namespace: reseat
spec:
  selector:
    app: performance-service
  ports:
    - port: 8083
      targetPort: 8083
