
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: reseat
data:
  SPRING_PROFILES_ACTIVE: "toss,performance-api"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/reseat?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul&useSSL=false"
  SPRING_DATASOURCE_USERNAME: root
  ORDER_SERVICE_URL: http://order-service:8082
  PERFORMANCE_SERVICE_URL: http://performance-service:8083
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  # 2026-09-08: Tempo가 observability/ 스택으로 K3s에 편입되면서 실제 수신지로 변경
  OTLP_ENDPOINT: http://tempo:4318/v1/traces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: reseat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: order-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_be/order-service:k3s-tempo-otlp
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: order-config
          env:
            - name: TZ
              value: Asia/Seoul
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: ENCRYPTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: ENCRYPTION_SECRET_KEY
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: TOSS_SECRET_KEY
            - name: TOSS_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: TOSS_CLIENT_KEY
          resources:
            # CPU request는 실사용량(top pods 기준 ~13m) 대비 요청값이 19배 컸음 - 실사용량 대비
            # 여유를 넉넉히 둔 100m으로 재조정(2026-09-08). limit은 순간 버스트 대비 그대로 유지.
            requests:
              cpu: 100m
              memory: 448Mi
            limits:
              cpu: 500m
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 35
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: reseat
spec:
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
