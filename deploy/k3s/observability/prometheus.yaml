# Prometheus - 4개 서비스의 /actuator/prometheus + kubelet 내장 cAdvisor(컨테이너 리소스 메트릭)를 scrape.
# docker-compose 시절엔 별도 cadvisor 컨테이너가 필요했지만, K3s는 kubelet이 이미
# /metrics/cadvisor 엔드포인트를 갖고 있어서(API 서버 프록시로 접근) 별도 파드 없이 재사용함.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: reseat
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 1m

    scrape_configs:
      - job_name: 'gateway-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway-service:8080']

      - job_name: 'user-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service:8081']

      - job_name: 'order-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service:8082']

      - job_name: 'performance-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['performance-service:8083']

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: reseat
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: reseat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=48h
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 300m
              memory: 400Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: reseat
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
