# Prometheus/Promtail 전용 서비스어카운트 + 읽기전용 RBAC.
# Prometheus는 kubelet의 cAdvisor 엔드포인트를 API 서버 프록시로 scrape하기 위해
# nodes/proxy가 필요하고, Promtail은 kubernetes_sd_configs(role: pod)로 파드 목록을 조회하기 위해
# pods/nodes list·watch가 필요함. 둘 다 클러스터 리소스를 읽기만 함(get/list/watch만 부여).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: reseat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: reseat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: reseat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-reader
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: reseat
