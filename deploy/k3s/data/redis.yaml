# Redis — Deployment (PVC 없음, 의도적).
# 지금 compose(deploy/docker-compose.deploy.yml)에도 redis는 volumes 마운트가 없어서
# 이미 재시작하면 데이터가 날아가는 구조(refresh token 저장용, TTL로 자연 만료되니 허용됨).
# 그래서 여기도 StatefulSet+PVC 대신 그냥 Deployment로 — 현재 동작을 그대로 반영.
# medium 노드(taint: role=db)에 배치하는 건 "데이터 레이어" 그룹핑 취지 유지용.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: reseat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        role: db
      tolerations:
        - key: role
          operator: Equal
          value: db
          effect: NoSchedule
      containers:
        - name: redis
          image: redis:8
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: reseat
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
