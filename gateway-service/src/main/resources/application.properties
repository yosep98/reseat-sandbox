spring.application.name=gateway-service
server.port=8080

# 게이트웨이는 DB가 없음 - 루트 build.gradle의 subprojects{} 블록이 모든 모듈에
# spring-boot-starter-data-jpa/mysql-connector-j를 강제로 넣어서, datasource 설정이 없으면
# 부팅 시 DataSource 자동구성이 실패한다. 그래서 명시적으로 꺼둠.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

# 라우팅 대상 (properties 기반 routes 대신 GatewayRouteConfig의 RouterFunction으로 전환됨)
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
order-service.url=${ORDER_SERVICE_URL:http://localhost:8082}
performance-service.url=${PERFORMANCE_SERVICE_URL:http://localhost:8083}

# common의 JwtProvider가 요구하는 값 - user/order/performance-service와 동일한 시크릿 공유해야
# 게이트웨이가 발급 주체가 다른 서비스에서 만든 토큰도 검증 가능
jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-in-real-deployment-32bytes+}
jwt.expiration-millis=1800000
jwt.refresh-expiration-millis=604800000

# 2차 rate limit(유저 단위)용 카운터 저장소 - 1차(Traefik, IP 단위)와 별개
spring.data.redis.host=localhost
spring.data.redis.port=6379

# standby(대기열) 신청/취소 매크로 방지: 유저(JWT sub)당 windowSeconds 동안 maxRequests건 초과 시 429
rate-limit.standby.window-seconds=10
rate-limit.standby.max-requests=5

logging.level.org.springframework.web=warn
logging.level.org.springframework.data=warn

management.endpoints.web.exposure.include=health,info,prometheus,metrics,condition
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


