spring.application.name=performance-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/reseat?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB Connection 10개로 제한
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Redis Pool
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=2000ms

# Elastic Search
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=3000
spring.elasticsearch.socket-timeout=5000

logging.level.root=info
logging.level.org.springframework.web=warn
logging.level.org.springframework.data=warn

order-service.url=http://localhost:8082
user-service.url=http://localhost:8081

# 초기 데이터 적재 시, 주석 비활성화
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true

# S3 설정
cloud.aws.region=ap-northeast-2
cloud.aws.s3.bucket=team01-reseat-bucket
cloud.aws.s3.image-prefix=image/

# user-service JWT 설정
jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-in-real-deployment-32bytes+}
jwt.expiration-millis=1800000
jwt.refresh-expiration-millis=604800000

# RAG 환경변수
openai.api-key=${OPENAI_API_KEY:}
openai.embedding-model=text-embedding-3-small
openai.embedding-dims=1536
openai.chat-model=gpt-4o-mini

management.endpoints.web.exposure.include=health,info,prometheus,metrics,condition
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

management.otlp.metrics.export.enabled=false

management.prometheus.metrics.export.enabled=true
